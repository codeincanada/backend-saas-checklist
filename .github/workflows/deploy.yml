name: Deploy to RV415

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checklist-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to RV415
    runs-on:
      - self-hosted
      - Linux
      - X64
      - rv415
      - checklist-production
    environment:
      name: production
      url: https://checklist.w-b.dev
    timeout-minutes: 15
    steps:
      - name: Check out merged revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy and verify production
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: .github/scripts/deploy-production.sh
