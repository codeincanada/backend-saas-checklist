name: CI and Deploy to RV415

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checklist-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  deploy:
    name: Deploy to RV415
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on:
      - self-hosted
      - Linux
      - X64
      - rv415
      - checklist-production
    environment:
      name: production
      url: https://checklist.w-b.dev
    timeout-minutes: 15
    steps:
      - name: Check out merged revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy and verify production
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: .github/scripts/deploy-production.sh
